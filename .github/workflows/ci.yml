name: CI

# paths-ignore: ドキュメントだけの変更では CI を起動しない。
# 変更ファイルが「すべて」パターンに一致する場合にのみスキップされるため、
# 1 ファイルでもコードが混ざれば通常どおり全ステップが実行される。
# （このファイル自体は対象外なので、ci.yml の変更は必ず CI で検証される）
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Actionsタブの「Run workflow」ボタンから、mainへのマージを待たずに手動でも実行できるようにする。
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    # D1（SQLite互換）はサーバープロセスを必要としないため、テスト用DBサービスは不要。
    # スキーマ検証は wrangler d1 migrations apply --local（マイグレーション追加後に有効化する）で行う。

    steps:
      - uses: actions/checkout@v7

      # pnpm は setup-node より先に入れる（setup-node の cache: pnpm が
      # pnpm store path を実行するため、pnpm が PATH にある必要がある）。
      # バージョンは package.json の packageManager フィールドから解決される。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # verify（lint/format/typecheck/test/build）が通ったあと、Cloudflareへ反映する。
  # 実行条件: mainへのpush（自動）、またはActionsタブからの手動実行（workflow_dispatch）。
  # PRの検証実行（pull_request）では動かさない。
  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 未適用のマイグレーションだけが実行されるため、複数回実行しても安全。
      - name: Apply D1 migrations
        run: pnpm --filter backend exec wrangler d1 migrations apply family-todo-db --remote

      # 公開しても問題ない設定値は apps/backend/wrangler.jsonc の vars に置いている。
      # ここで登録するのは、リポジトリに置けない本当の秘密の値だけ。
      # 毎回上書き登録することで、GitHubのSecretsを唯一の正としてCloudflare側と揃える。
      - name: Set backend secrets (Cloudflare Workers)
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRET" | pnpm --filter backend exec wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$VAPID_PRIVATE_KEY" | pnpm --filter backend exec wrangler secret put VAPID_PRIVATE_KEY
          printf '%s' "$VAPID_SUBJECT" | pnpm --filter backend exec wrangler secret put VAPID_SUBJECT

      - name: Deploy backend (Cloudflare Workers)
        run: pnpm --filter backend run deploy

      # NEXT_PUBLIC_ で始まる値は、ビルド時にJavaScriptへ埋め込まれる（実行時には差し替えられない）。
      # そのためデプロイのたびにここで渡す必要がある。いずれもブラウザに渡る公開情報。
      - name: Deploy frontend (Cloudflare Workers, OpenNext)
        env:
          NEXT_PUBLIC_API_BASE_URL: https://family-todo-backend.koekoe-app.workers.dev
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 7906177976-p7okj9rtv4hebh9an90s1eb37qb1939j.apps.googleusercontent.com
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BD9_l_rqGhjVwnZ3cF7z1uFYHLUZ0dYTcHohtEUEAWpsQ-VLRbL3j5DP4BspldWQl-HOECQYSgsxBaMqB_tbYec
        run: pnpm --filter frontend run deploy
