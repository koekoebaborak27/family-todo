name: CI

# paths-ignore: ドキュメントだけの変更では CI を起動しない。
# 変更ファイルが「すべて」パターンに一致する場合にのみスキップされるため、
# 1 ファイルでもコードが混ざれば通常どおり全ステップが実行される。
# （このファイル自体は対象外なので、ci.yml の変更は必ず CI で検証される）
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    # D1（SQLite互換）はサーバープロセスを必要としないため、テスト用DBサービスは不要。
    # スキーマ検証は wrangler d1 migrations apply --local（マイグレーション追加後に有効化する）で行う。

    steps:
      - uses: actions/checkout@v7

      # pnpm は setup-node より先に入れる（setup-node の cache: pnpm が
      # pnpm store path を実行するため、pnpm が PATH にある必要がある）。
      # バージョンは package.json の packageManager フィールドから解決される。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
