name: CI

# paths-ignore: ドキュメントだけの変更では CI を起動しない。
# 変更ファイルが「すべて」パターンに一致する場合にのみスキップされるため、
# 1 ファイルでもコードが混ざれば通常どおり全ステップが実行される。
# （このファイル自体は対象外なので、ci.yml の変更は必ず CI で検証される）
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Actionsタブの「Run workflow」ボタンから、mainへのマージを待たずに手動でも実行できるようにする。
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    # D1（SQLite互換）はサーバープロセスを必要としないため、テスト用DBサービスは不要。
    # スキーマ検証は wrangler d1 migrations apply --local（マイグレーション追加後に有効化する）で行う。

    steps:
      - uses: actions/checkout@v7

      # pnpm は setup-node より先に入れる（setup-node の cache: pnpm が
      # pnpm store path を実行するため、pnpm が PATH にある必要がある）。
      # バージョンは package.json の packageManager フィールドから解決される。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # verify（lint/format/typecheck/test/build）が通ったあと、Cloudflareへ反映する。
  # 実行条件: mainへのpush（自動）、またはActionsタブからの手動実行（workflow_dispatch）。
  # PRの検証実行（pull_request）では動かさない。
  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 未適用のマイグレーションだけが実行されるため、複数回実行しても安全。
      - name: Apply D1 migrations
        run: pnpm --filter backend exec wrangler d1 migrations apply family-todo-db --remote

      - name: Deploy backend (Cloudflare Workers)
        run: pnpm --filter backend run deploy

      - name: Deploy frontend (Cloudflare Workers, OpenNext)
        run: pnpm --filter frontend run deploy
